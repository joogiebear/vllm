<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERCLOCK — icon sheet (tiers, managers, badges)</title>
<style>
  body {
    margin: 0; padding: 24px; background: #0b0f17; color: #eef3f9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #93a3b8; margin: 0 0 20px; }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid #1d2636;
  }
  .name { width: 120px; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .sizes { display: flex; align-items: center; gap: 24px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell span { font-size: 11px; color: #93a3b8; }
  h2.sec { font-size: 14px; margin: 24px 0 8px; color: #93a3b8; }
</style>
</head>
<body>
  <h1>Icon sheet</h1>
  <p class="sub">Tiers, managers and achievement badges, 20 / 32 / 64 px, stroke 1.8, on #0b0f17.</p>
  <div id="sheet"></div>
  <script type="module">
    import { TIER_COLORS, icon, managerIcon, badge } from '../src/idle/icons.js';
    const sheet = document.getElementById('sheet');

    function row(nameText) {
      const row = document.createElement('div');
      row.className = 'row';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = nameText;
      const sizes = document.createElement('div');
      sizes.className = 'sizes';
      row.append(name, sizes);
      sheet.append(row);
      return sizes;
    }

    function section(title) {
      const h = document.createElement('h2');
      h.className = 'sec';
      h.textContent = title;
      sheet.append(h);
    }

    section('Tier icons');
    for (const [id, color] of Object.entries(TIER_COLORS)) {
      const sizes = row(id);
      for (const size of [20, 32, 64]) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const svg = icon(id, size);
        svg.style.color = color;
        const label = document.createElement('span');
        label.textContent = size + 'px';
        cell.append(svg, label);
        sizes.append(cell);
      }
    }

    section('Manager icons');
    for (const [id] of Object.entries(TIER_COLORS)) {
      const sizes = row('manager ' + id);
      for (const size of [20, 32, 64]) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.append(managerIcon(id, size));
        const label = document.createElement('span');
        label.textContent = size + 'px';
        cell.append(label);
        sizes.append(cell);
      }
    }

    section('Achievement badges');
    const KINDS = [
      { kind: 'owned', gen: 'pi', label: 'owned (pi)' },
      { kind: 'lifetime', label: 'lifetime' },
      { kind: 'prestiges', label: 'prestiges' },
      { kind: 'taps', label: 'taps' },
      { kind: 'rushGames', label: 'rush games' },
      { kind: 'events', label: 'events' },
      { kind: 'regions', label: 'regions' },
      { kind: 'allPerks', label: 'all perks' },
      { kind: 'allManagers', label: 'all managers' },
    ];
    for (const k of KINDS) {
      for (const unlocked of [false, true]) {
        const sizes = row(k.label + (unlocked ? ' unlocked' : ' locked'));
        for (const size of [20, 32, 64]) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.append(badge({ test: { kind: k.kind, gen: k.gen } }, unlocked, size));
          const label = document.createElement('span');
          label.textContent = size + 'px';
          cell.append(label);
          sizes.append(cell);
        }
      }
    }
  </script>
</body>
</html>
