<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } input, textarea { -webkit-user-select: text; user-select: text; }</style>
  <script>
    // iOS Safari ignores user-scalable=no, so block pinch zoom here. touch-action handles double-tap.
    for (const t of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
  <title>OVERCLOCK</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a27;
      --border: #1d2636;
      --text: #eef3f9;
      --dim: #93a3b8;
      --affordable: #ffb547;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    [hidden] { display: none !important; }
    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* Header */
    #hud {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    #hud-left { display: flex; flex-direction: column; min-width: 0; }
    #tokens {
      font-size: 30px; font-weight: 800; line-height: 1.1;
      color: var(--text); letter-spacing: -0.01em;
    }
    #rate { font-size: 13px; color: var(--dim); }
    #hud-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 4px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 13px; white-space: nowrap; text-decoration: none;
    }
    #weights-chip { color: var(--affordable); }
    #rush { cursor: pointer; }
    .buy-sel { display: flex; gap: 4px; }
    .buy-sel button {
      min-height: 44px; padding: 0 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--dim); font-size: 13px; cursor: pointer;
    }
    .buy-sel button.active {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }

    /* Tabs (bottom menu) */
    #tabs {
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #tabs button {
      position: relative; flex: 1 1 0; min-width: 0;
      min-height: 44px; padding: 0 4px;
      border: none; border-radius: 0;
      background: transparent; color: var(--dim);
      font-size: 13px; cursor: pointer; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    #tabs button[aria-current="page"] {
      background: var(--bg); color: var(--text); font-weight: 700;
    }
    .tab-dot {
      position: absolute; top: 8px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--affordable);
    }

    /* Scroll area */
    #tab-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px;
    }

    /* Banner */
    #banner { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .banner-msg {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      font-size: 13px; color: var(--text);
    }
    .banner-msg button {
      min-height: 44px; min-width: 44px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--dim); cursor: pointer;
    }

    /* Generator cards */
    #gen-cards { display: flex; flex-direction: column; gap: 10px; }
    .gen-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .gen-top { display: flex; align-items: center; gap: 10px; }
    .gen-card.locked .gen-top { opacity: 0.5; }
    .gen-icon {
      position: relative; width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid var(--tier-color, var(--dim));
      background: var(--bg); color: var(--text);
      font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .gen-icon-count {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .gen-id { min-width: 0; }
    .gen-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .gen-milestone { font-size: 12px; color: var(--dim); }
    .gen-bar {
      position: relative; height: 30px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border); overflow: hidden;
    }
    .gen-bar-fill {
      position: absolute; inset: 0;
      transform-origin: left center; transform: scaleX(0);
      background: var(--affordable); opacity: 0.22;
    }
    .gen-bar-payout {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .gen-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .gen-buy {
      flex: 1; min-height: 44px; padding: 0 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--dim); font-size: 14px; cursor: pointer;
    }
    .gen-buy.afford {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }
    .gen-buy:disabled { opacity: 0.5; cursor: default; }
    .gen-status { font-size: 13px; color: var(--dim); white-space: nowrap; }

    /* Upgrades tab */
    #up-seg { display: flex; gap: 4px; margin-bottom: 10px; }
    #up-seg button {
      flex: 1; min-height: 44px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--dim); font-size: 14px; cursor: pointer;
    }
    #up-seg button.active {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }
    #man-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    #up-grid { display: flex; flex-direction: column; gap: 8px; }
    #buy-all {
      min-height: 44px; width: 100%; border-radius: 8px; margin-bottom: 4px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 14px; cursor: pointer;
    }
    #buy-all:disabled { opacity: 0.5; cursor: default; }
    .up-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .up-row.dim { opacity: 0.55; }
    .up-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .up-row .name { font-size: 14px; font-weight: 700; color: var(--text); }
    .up-row .effect { font-size: 12px; color: var(--dim); }
    .up-row .buy {
      min-height: 44px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--dim); font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .up-row .buy.afford {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }
    .up-row .buy:disabled { opacity: 0.5; cursor: default; }
    .up-row .buy .gain { display: block; font-size: 11px; }
    .up-row .check { color: var(--affordable); font-size: 18px; }
    .up-row.owned { padding: 8px 12px; }
    .up-row.owned .buy { display: none; }

    /* Prestige tab */
    #tab-prestige h2 { font-size: 18px; color: var(--text); margin: 0; }
    #tab-prestige p { font-size: 13px; color: var(--dim); margin: 4px 0 0; }
    #prestige-hint { margin-bottom: 12px; }
    .hint-bar {
      height: 8px; border-radius: 4px;
      background: var(--bg); border: 1px solid var(--border); overflow: hidden;
    }
    #prestige-hint-fill { height: 100%; width: 0; background: var(--affordable); }
    #prestige-hint-text { font-size: 13px; color: var(--dim); margin-top: 6px; }
    #prestige-hint-bonus { font-size: 12px; color: var(--dim); margin-top: 2px; }
    #prestige {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
    }
    .p-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 12px;
    }
    .p-avail { display: flex; flex-direction: column; align-items: flex-end; }
    .p-avail span:first-child { font-size: 22px; font-weight: 800; color: var(--affordable); }
    .p-avail span:last-child { font-size: 11px; color: var(--dim); }
    #prestige-btn {
      width: 100%; min-height: 48px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--dim); font-size: 16px; font-weight: 800;
      letter-spacing: 0.08em; cursor: pointer;
    }
    #prestige-btn:not(:disabled) {
      background: var(--affordable); border-color: var(--affordable); color: #0b0f17;
    }
    #prestige-btn.armed { background: #fc8181; border-color: #fc8181; color: #0b0f17; }
    #prestige-btn:disabled { opacity: 0.5; cursor: default; }
    #prestige-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .wu {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .wu-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .wu .name { font-size: 14px; font-weight: 700; color: var(--text); }
    .wu .effect { font-size: 12px; color: var(--dim); }
    .wu .buy {
      min-height: 44px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--dim); font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .wu .buy:not(:disabled) {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }
    .wu .buy:disabled { opacity: 0.5; cursor: default; }
    .wu .check { color: var(--affordable); font-size: 18px; }

    /* Shop tab */
    .shop-note { font-size: 14px; color: var(--dim); }

    /* More tab */
    #tab-more { display: flex; flex-direction: column; gap: 12px; }
    #more-seg { display: flex; gap: 4px; margin-bottom: 10px; }
    #more-seg button {
      flex: 1; min-height: 44px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--dim); font-size: 14px; cursor: pointer;
    }
    #more-seg button.active {
      background: var(--affordable); border-color: var(--affordable);
      color: #0b0f17; font-weight: 700;
    }
    .settings-row { display: flex; flex-direction: column; gap: 6px; }
    .settings-row button {
      min-height: 44px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 14px; cursor: pointer;
    }
    .settings-row button.armed {
      background: #fc8181; border-color: #fc8181; color: #0b0f17; font-weight: 700;
    }
    #more-settings textarea {
      width: 100%; min-height: 70px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 12px; padding: 8px; resize: vertical;
    }
    #settings-msg { font-size: 13px; color: var(--dim); min-height: 1em; }

    @keyframes flash {
      0% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.6); }
      100% { box-shadow: 0 0 0 8px rgba(255, 181, 71, 0); }
    }
    .flash { animation: flash 0.5s ease-out; }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="hud-left">
        <div id="tokens" class="value">0</div>
        <div id="rate"><span id="tps">0</span> per sec</div>
      </div>
      <div id="hud-right">
        <div id="weights-chip" class="chip" hidden>Weights +0%</div>
        <div id="buy-sel" class="buy-sel" role="group" aria-label="Buy amount">
          <button type="button" data-mode="1" class="active">x1</button>
          <button type="button" data-mode="10">x10</button>
          <button type="button" data-mode="100">x100</button>
          <button type="button" data-mode="max">Max</button>
        </div>
        <a href="#" id="rush" class="chip rush">Rush ready</a>
      </div>
    </header>

    <main id="tab-scroll">
      <section id="tab-game" aria-label="Game">
        <div id="banner" hidden></div>
        <div id="gen-cards"></div>
      </section>

      <section id="tab-upgrades" aria-label="Upgrades" hidden>
        <div id="up-seg" role="tablist" aria-label="Upgrades section">
          <button type="button" data-seg="managers">Managers</button>
          <button type="button" data-seg="upgrades">Upgrades</button>
        </div>
        <div id="man-grid"></div>
        <div id="up-grid"></div>
      </section>

      <section id="tab-prestige" aria-label="Prestige" hidden>
        <div id="prestige-hint">
          <div class="hint-bar"><div id="prestige-hint-fill"></div></div>
          <div id="prestige-hint-text">…</div>
          <div id="prestige-hint-bonus"></div>
        </div>
        <section id="prestige">
          <div class="p-head">
            <div>
              <h2>Prestige</h2>
              <p>Reset the run, keep your Weights.</p>
            </div>
            <div class="p-avail">
              <span>+<span id="w-avail">0</span></span>
              <span>weights available</span>
            </div>
          </div>
          <button type="button" id="prestige-btn" disabled>PRESTIGE</button>
          <div id="prestige-grid"></div>
        </section>
      </section>

      <section id="tab-shop" aria-label="Shop" hidden>
        <p class="shop-note">The arcade is the shop: play Rush, come back with a score.</p>
      </section>

      <section id="tab-more" aria-label="More" hidden>
        <div id="more-seg" role="tablist" aria-label="More section">
          <button type="button" data-seg="achievements">Achievements</button>
          <button type="button" data-seg="stats">Stats</button>
          <button type="button" data-seg="settings">Settings</button>
        </div>
        <div id="more-achievements"></div>
        <div id="more-stats"></div>
        <div id="more-settings">
          <div class="settings-row">
            <button type="button" id="export-btn">Export save</button>
            <textarea id="export-area" rows="3" readonly></textarea>
          </div>
          <div class="settings-row">
            <button type="button" id="import-btn">Import save</button>
            <textarea id="import-area" rows="3" placeholder="Paste a save string"></textarea>
          </div>
          <div class="settings-row">
            <button type="button" id="reset-btn">HARD RESET</button>
          </div>
          <p id="settings-msg" role="status"></p>
        </div>
      </section>
    </main>

    <nav id="tabs" aria-label="Sections">
      <button type="button" data-tab="game" aria-current="page">Game</button>
      <button type="button" data-tab="upgrades">Upgrades<span class="tab-dot" hidden></span></button>
      <button type="button" data-tab="prestige">Prestige<span class="tab-dot" hidden></span></button>
      <button type="button" data-tab="shop">Shop</button>
      <button type="button" data-tab="more">More</button>
    </nav>
  </div>
  <script type="module" src="src/idle/app.js?v=20261103044134"></script>
</body>
</html>
