<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OVERCLOCK</title>
  <style>
    /* Palette: near-black with neon cyan / magenta / lime / amber.
       System monospace. No canvas: plain DOM and CSS. */
    :root {
      --bg: #04050a;
      --panel: #0a0d15;
      --border: #1d2740;
      --text: #e8f4ff;
      --dim: #5a6a80;
      --cyan: #00e5ff;
      --magenta: #ff4fd8;
      --lime: #a8ff3e;
      --amber: #ffb300;
      --red: #ff5050;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }
    #app {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
      /* Clearance so the fixed bottom bar never covers content. */
      padding-bottom: calc(56px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--dim);
    }
    button {
      background: #101522;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      padding: 6px 10px;
    }
    button:hover { border-color: var(--cyan); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:disabled:hover { border-color: var(--border); }
    button.active { border-color: var(--cyan); color: var(--cyan); }
    a { color: var(--cyan); }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .dim { color: var(--dim); }
    .value { color: var(--cyan); }

    /* Header */
    #hud { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
    #weights-value { color: var(--magenta); }

    /* Notification banners (offline earnings, rush payout) */
    #banner {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-color: var(--lime);
      color: var(--lime);
    }
    #banner[hidden] { display: none; }
    .banner-msg {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    /* Serve button and floating +N numbers */
    #serve-wrap { position: relative; }
    #serve {
      width: 100%;
      padding: 20px;
      font-size: 20px;
      letter-spacing: 4px;
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .float {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      color: var(--lime);
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      from { opacity: 1; margin-top: 0; }
      to   { opacity: 0; margin-top: -48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float { animation: none; }
    }

    /* Heat */
    #heat-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #heat-bar {
      flex: 1;
      min-width: 80px;
      height: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #06080d;
    }
    #heat-fill { height: 100%; width: 0%; background: var(--cyan); }
    #heat-fill.hot { background: var(--red); }
    #oc-state { color: var(--amber); min-width: 14ch; text-align: right; }

    /* Generators */
    .buy-sel { display: flex; gap: 6px; margin-bottom: 8px; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) auto auto auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }
    .row:first-of-type { border-top: none; }
    .row .owned { color: var(--dim); min-width: 8ch; text-align: right; }
    .row .out { color: var(--lime); min-width: 4ch; text-align: right; }
    .row .cost { color: var(--amber); min-width: 8ch; text-align: right; }
    .row .dbl { color: var(--dim); min-width: 7ch; text-align: right; font-size: 12px; }
    .row[hidden] { display: none; }
    @media (max-width: 560px) {
      .row { grid-template-columns: minmax(0, 1fr) auto auto; }
      .row .name { grid-column: 1 / -1; }
      .row .owned { grid-column: 1; }
      .row .out { grid-column: 2; }
      .row .cost { grid-column: 3; }
      .row .dbl { grid-column: 1 / -1; text-align: left; }
      .row .buy { grid-column: 1 / -1; width: 100%; }
    }
    @media (max-width: 599px) {
      /* Phone: every button is a 44px tap target. */
      button { min-height: 44px; }
      #rush { min-height: 44px; }
    }

    /* Upgrades */
    #up-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card[hidden] { display: none; }
    .card .name { color: var(--cyan); }
    .card .effect { color: var(--dim); font-size: 12px; }
    .card .cost { color: var(--amber); font-size: 12px; }
    #purchased summary { cursor: pointer; color: var(--dim); }
    #purchased ul { margin: 8px 0 0; padding-left: 18px; color: var(--dim); font-size: 12px; }

    /* Prestige */
    #prestige-box { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 10px; }
    #prestige-btn { border-color: var(--magenta); color: var(--magenta); }
    #prestige-btn.armed { background: var(--magenta); color: #04050a; }
    #prestige-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .wu {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .wu .name { color: var(--magenta); }
    .wu .effect { color: var(--dim); font-size: 12px; }
    .wu .cost { color: var(--amber); font-size: 12px; }

    /* Actions */
    #actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #rush {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--cyan);
      border-radius: 6px;
      text-decoration: none;
    }
    #rush.disabled { opacity: 0.4; pointer-events: none; }
    #rush .cd { color: var(--amber); }

    /* Settings */
    #settings[hidden] { display: none; }
    #settings label { display: block; color: var(--dim); margin: 10px 0 4px; font-size: 12px; }
    #settings textarea {
      width: 100%;
      height: 64px;
      background: #06080d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-size: 11px;
    }
    #settings .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    #settings-msg { color: var(--lime); min-height: 1.2em; }
    #reset-btn.armed { background: var(--red); color: #04050a; }

    /* Bottom navigation */
    .tab-panel[hidden] { display: none; }
    #tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #tabs button {
      flex: 1;
      min-height: 44px;
      margin: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      position: relative;
      padding: 4px 2px;
    }
    #tabs button:hover { border-color: transparent; }
    #tabs button[aria-current="page"] { color: var(--cyan); }
    .tab-dot {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
    }
    .tab-dot[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud" class="panel">
      <div>tokens <span id="tokens" class="value">0</span></div>
      <div><span id="tps" class="value">0</span>/s</div>
      <div>weights <span id="weights-value">0</span></div>
    </header>

    <div id="tab-game" class="tab-panel">
      <div id="banner" class="panel" hidden></div>

      <div id="serve-wrap">
        <button id="serve" type="button">SERVE</button>
      </div>

      <section id="heat" class="panel">
        <h2>HEAT</h2>
        <div id="heat-row">
          <div id="heat-bar"><div id="heat-fill"></div></div>
          <span id="heat-num">0</span>
          <span id="oc-state">COOLING</span>
          <button id="overclock" type="button" disabled>OVERCLOCK OFF</button>
        </div>
      </section>

      <section id="generators" class="panel">
        <h2>GENERATORS</h2>
        <div class="buy-sel" role="group" aria-label="buy amount">
          <button type="button" data-mode="1" class="active">x1</button>
          <button type="button" data-mode="10">x10</button>
          <button type="button" data-mode="max">MAX</button>
        </div>
        <div id="gen-rows"></div>
      </section>

      <section id="actions" class="panel">
        <a id="rush" href="rush.html">RUSH</a>
      </section>
    </div>

    <div id="tab-upgrades" class="tab-panel" hidden>
      <section id="upgrades" class="panel">
        <h2>UPGRADES</h2>
        <div id="up-grid"></div>
        <details id="purchased">
          <summary>purchased</summary>
          <ul id="purchased-list"></ul>
        </details>
      </section>
    </div>

    <div id="tab-prestige" class="tab-panel" hidden>
      <section id="prestige" class="panel">
        <h2>PRESTIGE</h2>
        <div id="prestige-box">
          <div>weights available <span id="w-avail" class="value">0</span></div>
          <div class="dim">resets: tokens, generators, upgrades, heat</div>
          <button id="prestige-btn" type="button" disabled>PRESTIGE</button>
        </div>
        <div id="prestige-grid"></div>
      </section>
      <div id="prestige-hint" class="panel" hidden></div>
    </div>

    <div id="tab-shop" class="tab-panel" hidden></div>

    <div id="tab-settings" class="tab-panel" hidden>
      <section id="settings" class="panel">
        <h2>SETTINGS</h2>
        <label for="export-area">export (copy this text)</label>
        <textarea id="export-area" readonly></textarea>
        <div class="row-actions">
          <button id="export-btn" type="button">EXPORT</button>
        </div>
        <label for="import-area">import (paste save text)</label>
        <textarea id="import-area"></textarea>
        <div class="row-actions">
          <button id="import-btn" type="button">IMPORT</button>
          <button id="reset-btn" type="button">HARD RESET</button>
        </div>
        <div id="settings-msg" role="status"></div>
      </section>
    </div>
  </div>
  <nav id="tabs" aria-label="sections">
    <button type="button" data-tab="game" aria-current="page">Game</button>
    <button type="button" data-tab="upgrades">Upgrades<span class="tab-dot" hidden></span></button>
    <button type="button" data-tab="prestige">Prestige<span class="tab-dot" hidden></span></button>
    <button type="button" data-tab="shop">Shop</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>
  <script type="module" src="src/idle/app.js"></script>
</body>
</html>
